name: Smoke Builds

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  example-smoke-build:
    name: Smoke build ${{ matrix.example }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - examples-local/billboard-test
          - examples-local/hello-world
          - examples-local/line-test
          - examples-local/live-traffic
          - examples-local/local-load
          - examples-local/math-test
          - examples-local/mouse-latlon
          - examples-local/multisource
          - examples-local/point-test
          - examples-local/wmts-local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build root package
        run: npm run build

      - name: Install example dependencies
        working-directory: ${{ matrix.example }}
        run: |
          set -euo pipefail
          # Source imports and the example must use the same Babylon declarations.
          babylon_version="$(node -p "require('../../node_modules/@babylonjs/core/package.json').version")"
          mapfile -t babylon_packages < <(node -e 'const p=require("./package.json"); for(const name of Object.keys({...p.dependencies,...p.devDependencies})) if(name.startsWith("@babylonjs/")) console.log(name+"@"+process.argv[1]);' "${babylon_version}")
          npm install "${babylon_packages[@]}" --no-save --no-package-lock --no-audit --no-fund

      - name: Build example
        working-directory: ${{ matrix.example }}
        run: npm run build
