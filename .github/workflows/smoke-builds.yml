name: Smoke Builds

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  example-smoke-build:
    name: Smoke build ${{ matrix.example }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - examples-local/billboard-test
          - examples-local/hello-world
          - examples-local/line-test
          - examples-local/local-load
          - examples-local/math-test
          - examples-local/mouse-latlon
          - examples-local/multisource
          - examples-local/point-test
          - examples-local/wmts-local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build root package
        run: npm run build

      - name: Install example dependencies
        working-directory: ${{ matrix.example }}
        run: |
          BABYLON_VERSION=$(node -p "require('../../package-lock.json').packages['node_modules/@babylonjs/core'].version")
          npm install --no-save --package-lock=false \
            "@babylonjs/core@$BABYLON_VERSION" \
            "@babylonjs/gui@$BABYLON_VERSION" \
            "@babylonjs/loaders@$BABYLON_VERSION" \
            "@babylonjs/inspector@$BABYLON_VERSION" \
            "@babylonjs/materials@$BABYLON_VERSION"

      - name: Build example
        working-directory: ${{ matrix.example }}
        run: npm run build
