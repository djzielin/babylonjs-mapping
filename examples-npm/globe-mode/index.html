<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Globe · babylonjs-mapping</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
                --glass: rgba(14, 18, 24, .52);
                --line: rgba(255, 255, 255, .09);
                --text: #f2f5f8;
                --muted: rgba(242, 245, 248, .62);
            }
            * { box-sizing: border-box; }
            html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; color: var(--text); }
            #renderCanvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
            .glass {
                background: var(--glass); border: 1px solid var(--line);
                backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
            }
            button, input { font: inherit; color: inherit; }
            :focus-visible { outline: 2px solid #9cc9ff; outline-offset: 2px; }
            .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

            #search { position: absolute; top: 16px; left: 16px; width: min(320px, calc(100vw - 32px)); }
            #addressSearch {
                width: 100%; height: 40px; padding: 0 16px; border-radius: 20px; font-size: 14px;
            }
            #addressSearch::placeholder { color: var(--muted); }
            #addressResults {
                margin: 6px 0 0; padding: 6px; list-style: none; border-radius: 14px; font-size: 13px;
                max-height: 50vh; overflow: auto;
            }
            #addressResults li { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
            #addressResults li:hover, #addressResults li[aria-selected=true] { background: rgba(255, 255, 255, .1); }

            #caption {
                position: absolute; left: 32px; bottom: 88px; max-width: min(560px, calc(100vw - 64px));
                pointer-events: none; opacity: 0; transform: translateY(8px); isolation: isolate;
                transition: opacity .9s ease, transform .9s ease;
                /* A tight shadow for edges, a wide one for body: legible on snow, no box. */
                text-shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 2px 24px rgba(0, 0, 0, .5);
            }
            /* A faint wash behind the words, fading out before any edge shows. */
            #caption::before {
                content: ""; position: absolute; inset: -48px -80px -40px -60px; z-index: -1;
                background: radial-gradient(closest-side, rgba(0, 0, 0, .42), rgba(0, 0, 0, .3) 50%, rgba(0, 0, 0, 0));
            }
            #caption.shown { opacity: 1; transform: none; }
            #caption h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: -.02em; }
            #caption p { margin: 6px 0 0; font-size: 15px; font-weight: 500; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 3px rgba(0, 0, 0, .7), 0 0 14px rgba(0, 0, 0, .5); }

            #bar {
                position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
                display: flex; gap: 2px; padding: 4px; border-radius: 22px;
            }
            #bar button {
                height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: transparent;
                font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap;
                transition: background .2s, color .2s;
            }
            #bar button:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
            #bar button[aria-pressed=true] { color: var(--text); background: rgba(255, 255, 255, .15); }
            #bar button[hidden] { display: none; }

            #help {
                position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%);
                width: min(460px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 14px;
                font-size: 12.5px; line-height: 1.6; color: rgba(255, 255, 255, .85);
            }
            #attribution {
                position: absolute; right: 10px; bottom: 6px; max-width: min(46vw, 520px);
                font-size: 10px; color: rgba(255, 255, 255, .55); text-align: right; text-shadow: 0 0 3px #000;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            }
            #attribution:hover { white-space: normal; color: rgba(255, 255, 255, .8); }
            #attribution a { color: inherit; }
            @media (max-width: 560px) { #attribution { max-width: 70vw; } }
            #stats {
                position: absolute; top: 16px; right: 16px; padding: 8px 12px; border-radius: 10px;
                font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; color: rgba(255, 255, 255, .85);
            }
            #loading {
                position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                font-size: 13px; color: var(--muted); transition: opacity .6s;
            }
            @media (max-width: 560px) {
                #caption { left: 18px; bottom: 80px; }
                #bar button { padding: 0 10px; }
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas"></canvas>
        <div id="loading">Loading…</div>
        <div id="search">
            <input id="addressSearch" class="glass" type="search" placeholder="Search places" autocomplete="off"
                role="combobox" aria-expanded="false" aria-controls="addressResults" aria-label="Search places"/>
            <ul id="addressResults" class="glass" role="listbox" hidden></ul>
            <div id="addressStatus" class="sr-only" aria-live="polite"></div>
        </div>
        <div id="caption" aria-live="polite"><h1 id="captionTitle"></h1><p id="captionText"></p></div>
        <nav id="bar" class="glass" aria-label="Globe">
            <button id="tourButton" aria-pressed="false">Tour</button>
            <button id="photoButton" aria-pressed="true" title="Google photorealistic 3D tiles, with live ships">3D</button>
            <button id="roadsButton" aria-pressed="true" title="Live road traffic" hidden>Roads</button>
            <button id="airButton" aria-pressed="true" title="Live aircraft" hidden>Air</button>
            <button id="helpButton" aria-pressed="false" aria-controls="help">?</button>
        </nav>
        <div id="help" class="glass" hidden></div>
        <div id="attribution"></div>
        <div id="stats" class="glass" hidden></div>
    </body>
</html>
